# uv workspace: every Python package in the monorepo shares one lockfile and
# one set of lint and type-check rules.
[project]
name = "tramita-workspace"
version = "0.0.0"
description = "Workspace root for Tramita's Python packages (not published)."
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/agents"]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PL", "ASYNC"]
ignore = [
    "PLR0913", # agent tools legitimately take many keyword arguments
]

[tool.ruff.lint.isort]
known-first-party = ["tramita_agents"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
