[project]
name = "tramita-agents"
version = "0.1.0"
description = "Agent service: document reading, policy search, claim analysis and orchestration."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3",
    "boto3>=1.43",
    "fastapi>=0.120",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "uvicorn[standard]>=0.38",
]

[dependency-groups]
dev = ["boto3-stubs[s3]>=1.43", "httpx2>=2.15", "moto[s3]>=5.1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tramita_agents"]
