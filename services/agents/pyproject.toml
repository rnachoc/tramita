[project]
name = "tramita-agents"
version = "0.1.0"
description = "Agent service: document reading, policy search, claim analysis and orchestration."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3",
    "boto3>=1.43",
    # Spanish NER for person names, used by Presidio. Pinned wheel from spaCy's GitHub releases.
    "es-core-news-md @ https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl",
    "fastapi>=0.120",
    "pillow>=11.0",  # scan images: redaction boxes and format conversion
    "presidio-analyzer>=2.2.366",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "pypdfium2>=4.30",  # text layer of born-digital PDFs
    "pytesseract>=0.3.13",  # OCR wrapper; needs the tesseract binary with Spanish data
    # Offline public-suffix check for e-mail domains (imported directly in documents/pii.py).
    "tldextract>=5.4",
    "uvicorn[standard]>=0.38",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43",
    "httpx2>=2.15",
    "moto[s3]>=5.1",
    # Tests render synthetic documents with the data generator.
    "tramita-datagen",
]

[tool.uv.sources]
tramita-datagen = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tramita_agents"]

[tool.hatch.metadata]
# The Spanish spaCy model is only published as a wheel on GitHub releases.
allow-direct-references = true
