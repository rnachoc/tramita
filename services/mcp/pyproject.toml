[project]
name = "tramita-mcp"
version = "0.1.0"
description = "MCP server: read-only analyst tools over the core, with personal data masked."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.3",  # official Model Context Protocol SDK
    "tramita-agents",  # masking, policy search and the core client
]

[project.scripts]
tramita-mcp = "tramita_mcp.server:main"

[tool.uv.sources]
tramita-agents = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tramita_mcp"]
