{{- $root := . -}}
{{- $agents := include "tramita.secretValue" (dict "root" $root "key" "agents-key") -}}
{{- $console := include "tramita.secretValue" (dict "root" $root "key" "console-key") -}}
{{- $analyst := include "tramita.secretValue" (dict "root" $root "key" "analyst-key") -}}
{{- $admin := include "tramita.secretValue" (dict "root" $root "key" "admin-key") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tramita.fullname" . }}-secrets
  labels: {{- include "tramita.labels" . | nindent 4 }}
type: Opaque
stringData:
  agents-key: {{ $agents | quote }}
  console-key: {{ $console | quote }}
  analyst-key: {{ $analyst | quote }}
  admin-key: {{ $admin | quote }}
  # name:ROLE:key;... as the core reads it (ADR 0009).
  api-keys: {{ printf "agents:AGENT:%s;console:REVIEWER:%s;analyst:ANALYST:%s;admin:ADMIN:%s" $agents $console $analyst $admin | quote }}
  postgres-password: {{ include "tramita.secretValue" (dict "root" $root "key" "postgres-password") | quote }}
  s3-secret: {{ include "tramita.secretValue" (dict "root" $root "key" "s3-secret") | quote }}
