{{- if .Values.infrastructure.enabled }}
{{- $root := . -}}
{{- $infra := .Values.infrastructure -}}
{{- $secrets := printf "%s-secrets" (include "tramita.fullname" .) -}}
{{- /* Development-grade, single replica, the same images as Docker Compose (ADR 0019). */}}
{{- $pg := dict "root" . "component" "postgres" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tramita.name" $pg }}-init
  labels: {{- include "tramita.labels" . | nindent 4 }}
data:
  01-extensions.sql: |
    -- pgvector stores the policy clause embeddings next to the core data.
    CREATE EXTENSION IF NOT EXISTS vector;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tramita.name" $pg }}
  labels: {{- include "tramita.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "tramita.name" $pg }}
  replicas: 1
  selector:
    matchLabels: {{- include "tramita.selector" $pg | nindent 6 }}
  template:
    metadata:
      labels: {{- include "tramita.selector" $pg | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: {{ $infra.postgres.image }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          env:
            - {name: POSTGRES_USER, value: tramita}
            - {name: POSTGRES_DB, value: tramita}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $secrets }}, key: postgres-password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "tramita", "-d", "tramita"]}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - {name: init, configMap: {name: {{ include "tramita.name" $pg }}-init}}
        - {name: run, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $infra.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: {requests: {storage: {{ $infra.postgres.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tramita.name" $pg }}
  labels: {{- include "tramita.labels" . | nindent 4 }}
spec:
  selector: {{- include "tramita.selector" $pg | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
{{- $kafka := dict "root" . "component" "kafka" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tramita.name" $kafka }}
  labels: {{- include "tramita.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "tramita.selector" $kafka | nindent 6 }}
  template:
    metadata:
      labels: {{- include "tramita.selector" $kafka | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: kafka
          image: {{ $infra.kafka.image }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://{{ include "tramita.name" $kafka }}:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_NUM_PARTITIONS, value: "3"}
            # Topics are created explicitly by the services; typos must fail loudly.
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk}
          ports:
            - {name: kafka, containerPort: 9092}
          readinessProbe:
            tcpSocket: {port: kafka}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tramita.name" $kafka }}
  labels: {{- include "tramita.labels" . | nindent 4 }}
spec:
  selector: {{- include "tramita.selector" $kafka | nindent 4 }}
  ports:
    - {name: kafka, port: 9092, targetPort: kafka}
{{- $os := dict "root" . "component" "opensearch" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tramita.name" $os }}
  labels: {{- include "tramita.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
spec:
  serviceName: {{ include "tramita.name" $os }}
  replicas: 1
  selector:
    matchLabels: {{- include "tramita.selector" $os | nindent 6 }}
  template:
    metadata:
      labels: {{- include "tramita.selector" $os | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: opensearch
          image: {{ $infra.opensearch.image }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          env:
            - {name: discovery.type, value: single-node}
            - {name: bootstrap.memory_lock, value: "false"}
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms{{ $infra.opensearch.heap }} -Xmx{{ $infra.opensearch.heap }}"}
            # The security plugin is off: only pods allowed by the network policies reach
            # OpenSearch, and it holds the public policy conditions only (ADR 0019).
            - {name: DISABLE_SECURITY_PLUGIN, value: "true"}
            - {name: DISABLE_INSTALL_DEMO_CONFIG, value: "true"}
          ports:
            - {name: http, containerPort: 9200}
          readinessProbe:
            httpGet: {path: "/_cluster/health?wait_for_status=yellow&timeout=1s", port: http}
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - {name: data, mountPath: /usr/share/opensearch/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $infra.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: {requests: {storage: {{ $infra.opensearch.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tramita.name" $os }}
  labels: {{- include "tramita.labels" . | nindent 4 }}
spec:
  selector: {{- include "tramita.selector" $os | nindent 4 }}
  ports:
    - {name: http, port: 9200, targetPort: http}
{{- $s3 := dict "root" . "component" "object-store" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tramita.name" $s3 }}
  labels: {{- include "tramita.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-store
spec:
  serviceName: {{ include "tramita.name" $s3 }}
  replicas: 1
  selector:
    matchLabels: {{- include "tramita.selector" $s3 | nindent 6 }}
  template:
    metadata:
      labels: {{- include "tramita.selector" $s3 | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: object-store
          image: {{ $infra.objectStore.image }}
          securityContext: {allowPrivilegeEscalation: false}
          env:
            - {name: RUSTFS_VOLUMES, value: /data}
            - {name: RUSTFS_ADDRESS, value: "0.0.0.0:9000"}
            - {name: RUSTFS_CONSOLE_ENABLE, value: "false"}
            - {name: RUSTFS_ACCESS_KEY, value: tramita}
            - name: RUSTFS_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ $secrets }}, key: s3-secret}}
          ports:
            - {name: s3, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /health, port: s3}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $infra.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: {requests: {storage: {{ $infra.objectStore.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tramita.name" $s3 }}
  labels: {{- include "tramita.labels" . | nindent 4 }}
spec:
  selector: {{- include "tramita.selector" $s3 | nindent 4 }}
  ports:
    - {name: s3, port: 9000, targetPort: s3}
{{- $t := dict "root" . "component" "temporal" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tramita.name" $t }}
  labels: {{- include "tramita.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "tramita.selector" $t | nindent 6 }}
  template:
    metadata:
      labels: {{- include "tramita.selector" $t | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: temporal
          image: {{ $infra.temporal.image }}
          securityContext: {allowPrivilegeEscalation: false}
          env:
            - {name: DB, value: postgres12}
            - {name: DB_PORT, value: "5432"}
            - {name: POSTGRES_USER, value: tramita}
            - name: POSTGRES_PWD
              valueFrom: {secretKeyRef: {name: {{ $secrets }}, key: postgres-password}}
            - {name: POSTGRES_SEEDS, value: {{ include "tramita.name" $pg }}}
            - {name: BIND_ON_IP, value: 0.0.0.0}
            - name: TEMPORAL_BROADCAST_ADDRESS
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - {name: grpc, containerPort: 7233}
          readinessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 5
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tramita.name" $t }}
  labels: {{- include "tramita.labels" . | nindent 4 }}
spec:
  selector: {{- include "tramita.selector" $t | nindent 4 }}
  ports:
    - {name: grpc, port: 7233, targetPort: grpc}
{{- end }}
