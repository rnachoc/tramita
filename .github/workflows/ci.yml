name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan full history
        run: gitleaks git --redact --verbose

  history:
    # Keeps the history bisectable: every pushed commit must build on its own.
    name: every commit builds
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: astral-sh/setup-uv@v7
      - name: Build each pushed commit
        run: |
          cp .github/scripts/run-step.sh .github/scripts/check-each-commit.sh "$RUNNER_TEMP/"
          "$RUNNER_TEMP/run-step.sh" "history" \
            "$RUNNER_TEMP/check-each-commit.sh" "${{ github.event.before }}" "${{ github.sha }}"

  python:
    name: python lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: install tesseract with Spanish data (scan OCR)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-spa
          tesseract --list-langs | grep -qx spa
      - run: .github/scripts/run-step.sh "python lint" make py-lint
      - run: .github/scripts/run-step.sh "python tests" make py-test
      - name: Evaluate document reading (fake provider) with its regression gate
        run: .github/scripts/run-step.sh "extraction eval" bash -c 'make data && make eval-extraction ARGS=--gate'
      - name: Compare document reading with the baseline
        run: .github/scripts/run-step.sh "scorecard extraction" make scorecard ARGS="--sections extraction --name scorecard-extraction"

  java:
    name: java build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # The rules engine is cross-checked against the dataset generator's reference resolver.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: .github/scripts/run-step.sh "java build" make core-test

  console:
    name: console format, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: .github/scripts/run-step.sh "console install" make console-install
      - run: .github/scripts/run-step.sh "console tests" make console-test
      - run: .github/scripts/run-step.sh "console build" make console-build

  compose:
    name: infrastructure smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Use the documented environment template as .env
        run: cp .env.example .env
      - name: Start the stack and wait for every health check
        run: .github/scripts/run-step.sh "compose up" timeout 600 make up
      - name: Exercise every service with a real request
        run: .github/scripts/run-step.sh "compose smoke" make smoke
      - name: install tesseract with Spanish data (scan OCR)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-spa
      - name: Run the core against the stack, seed it and ingest claims end to end
        run: |
          set -a && . ./.env && set +a
          .github/scripts/run-step.sh "core against stack" bash -c \
            'make data && (cd services/core && mvn -B -q -DskipTests package) && deploy/compose/check-core.sh'
      - name: Cache the policy search models
        uses: actions/cache@v6
        with:
          path: models-cache
          key: policy-search-models-${{ hashFiles('services/agents/src/tramita_agents/settings.py', '.env.example') }}
      - name: Index the policy conditions and evaluate the search with its regression gate
        run: |
          set -a && . ./.env && set +a
          .github/scripts/run-step.sh "policy search index" make index
          # Every query set with the fast modes; the reranker (seconds per query on CPU) on the
          # claims and the keyword searches only.
          .github/scripts/run-step.sh "retrieval eval" make eval-retrieval \
            ARGS="--modes lexical,vector,hybrid --gate --name retrieval-fast"
          .github/scripts/run-step.sh "retrieval eval (reranked)" make eval-retrieval \
            ARGS="--modes reranked --sets claims,terms --gate --name retrieval-reranked"
          .github/scripts/run-step.sh "scorecard retrieval" make scorecard \
            ARGS="--sections retrieval-fast,retrieval-reranked --name scorecard-retrieval"
      - name: Analyse every claim with the agents and gate the outcome
        run: |
          set -a && . ./.env && set +a
          .github/scripts/run-step.sh "agents end to end" deploy/compose/check-agents.sh
          .github/scripts/run-step.sh "scorecard agents" make scorecard \
            ARGS="--sections agents --name scorecard-agents"
      - name: Publish claim events, run the workflows and signal a review through Kafka
        env:
          # A crash in native code (Kafka or Temporal clients) prints where it happened.
          PYTHONFAULTHANDLER: "1"
        run: |
          set -a && . ./.env && set +a
          .github/scripts/run-step.sh "events and workflows" deploy/compose/check-workflows.sh
      - name: Read every claim through the MCP server without personal data
        run: |
          set -a && . ./.env && set +a
          .github/scripts/run-step.sh "mcp end to end" deploy/compose/check-mcp.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - name: Review a claim through the console in a real browser
        run: |
          set -a && . ./.env && set +a
          make console-install
          .github/scripts/run-step.sh "console end to end" deploy/compose/check-console.sh
      - name: Show service status
        if: always()
        run: make ps
      - name: Dump logs on failure
        if: failure()
        run: |
          for svc in $(docker compose -f deploy/compose/docker-compose.yml ps -a --format '{{.Service}}'); do
            ANNOTATION_LINES=40 .github/scripts/run-step.sh "logs: $svc" \
              bash -c "docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail=40 $svc; false" || true
          done
      - name: Tear down
        if: always()
        run: make reset
