name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan full history
        run: gitleaks git --redact --verbose

  history:
    # Keeps the history bisectable: every pushed commit must build on its own.
    name: every commit builds
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: astral-sh/setup-uv@v7
      - name: Build each pushed commit
        run: |
          cp .github/scripts/run-step.sh .github/scripts/check-each-commit.sh "$RUNNER_TEMP/"
          "$RUNNER_TEMP/run-step.sh" "history" \
            "$RUNNER_TEMP/check-each-commit.sh" "${{ github.event.before }}" "${{ github.sha }}"

  python:
    name: python lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: .github/scripts/run-step.sh "python lint" make py-lint
      - run: .github/scripts/run-step.sh "python tests" make py-test

  java:
    name: java build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # The rules engine is cross-checked against the dataset generator's reference resolver.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: .github/scripts/run-step.sh "java build" make core-test

  compose:
    name: infrastructure smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack and wait for every health check
        run: .github/scripts/run-step.sh "compose up" timeout 600 make up
      - name: Exercise every service with a real request
        run: .github/scripts/run-step.sh "compose smoke" make smoke
      - name: Show service status
        if: always()
        run: make ps
      - name: Dump logs on failure
        if: failure()
        run: |
          for svc in $(docker compose -f deploy/compose/docker-compose.yml ps -a --format '{{.Service}}'); do
            ANNOTATION_LINES=40 .github/scripts/run-step.sh "logs: $svc" \
              bash -c "docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail=40 $svc; false" || true
          done
      - name: Tear down
        if: always()
        run: make reset
